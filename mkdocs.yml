# mkdocs config — read by Read the Docs (see .readthedocs.yaml).
#
# This is the *only* configuration file RTD needs to build the site: nav,
# theme, and the markdown extensions. The actual prose lives under
# docs/index.md and friends.
#
# IMPORTANT — dependency-free build:
# We use the `mkdocs` theme (bundled with the `mkdocs` package itself)
# and Python-Markdown extensions that ship with mkdocs / Python-Markdown
# core. No `mkdocs-material`, no `pymdownx`, no third-party requirements
# — RTD's pre-installed mkdocs environment may or may not install our
# requirements.txt before running `mkdocs build`, and a missing
# optional dep is the fastest way to break every future build.
site_name: central-logs
site_description: >-
  Self-hosted, single-node centralized logging platform — ingest, store,
  query, dashboard, forecast, detect anomalies, error tracking, and
  expose everything to AI agents over MCP.
site_url: https://central-logs.readthedocs.io/

docs_dir: docs

# `mkdocs` theme (the built-in default; bundled with the `mkdocs`
# package itself, so the build never depends on a requirements-file
# install to succeed). If you later switch to `material`, also pin
# mkdocs-material in requirements.txt AND ensure RTD's mkdocs builder
# actually installs it.
theme:
  name: mkdocs
  highlightjs: true
  navigation_depth: 3

# Python-Markdown extensions that ship with mkdocs / Python-Markdown
# core. No third-party packages required — works in any RTD mkdocs
# environment without a requirements-file install.
markdown_extensions:
  - admonition           # !!! note, !!! warning, etc.
  - attr_list            # {: .class key=value} on headings/blocks
  - def_list             # definition lists
  - footnotes            # [^1] footnotes
  - md_in_html           # markdown inside raw HTML
  - tables               # GFM tables
  - toc:
      permalink: true
  - fenced_code          # ``` blocks
  - codehilite:
      guess_lang: false  # don't try to guess from filename extension

plugins:
  - search

# Keep mkdocs permissive — broken anchors / unknown cross-doc links
# warn but don't fail the build. Explicitly off (instead of relying
# on the default) so the build behavior is obvious to anyone tweaking
# this file.
strict: false

# `llms.txt` lives next to the markdown under docs/ — mkdocs copies any
# non-markdown file there to the site root unchanged, so it ends up
# served at /llms.txt for LLM agents without an extra_files directive.

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - For AI agents: llms.md
  - User Guide:
      - Ingest:
          - ingestion/index.md
          - ingestion/http.md
          - ingestion/otlp.md
          - ingestion/syslog.md
          - ingestion/sentry.md
      - Query: query.md
      - Dashboards: dashboards.md
      - Alerts: alerts.md
      - Error Tracking: ERROR_TRACKING.md
      - AI features: ai.md
      - Performance: performance.md
  - Operator Guide:
      - Install & deploy: install.md
      - Configuration: CONFIGURATION.md
      - Security: SECURITY.md
      - Operations: OPERATIONS.md
  - Reference:
      - HTTP API: API.md
      - MCP tools: mcp.md
      - CLI flags: reference/cli.md
      - Config reference: reference/config.md
      - LLM providers: reference/llm-providers.md
      - Architecture: ARCHITECTURE.md
      - Project status: STATUS.md
  - Development: DEVELOPMENT.md
  - Features: FEATURES.md
  - Integration: INTEGRATION.md
  - Integration samples: integration-sample/README.md
  - Quick integrate: integrate.md