# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Source layout:
#   mkdocs / sphinx sources live under docs/. Read the Docs needs a `mkdocs`
#   config or a `sphinx` config; we use mkdocs.yml (mkdocs-material is RTD's
#   recommended theme family for plain-Markdown sites). When you only need
#   plain Markdown without an external builder, set `sphinx.configuration`
#   to a Sphinx project's conf.py instead.
#
# Versioned docs:
#   We don't pin a specific release line — central-logs is shipped as a
#   single moving-target binary. RTD will build `latest` from `main`. Add
#   a `versions:` block here when a stable release branch is cut.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # RTD's `build:` schema does NOT support `fail_on_warning` — that's a
  # mkdocs key (see `mkdocs.yml`). The build is permissive at the
  # mkdocs level (`strict: false`) so link rot in third-party docs
  # doesn't break deploys.

mkdocs:
  configuration: mkdocs.yml
  # We intentionally keep mkdocs strict-mode OFF (mkdocs.yml). That
  # matches "don't fail the build on a single broken in-page anchor":
  # Markdown → HTML conversion is imperfect and we don't want one
  # renamed heading to block deploys.

formats:
  # llms.txt is served at /llms.txt for LLM agents (see docs/llms.md).
  - htmlzip